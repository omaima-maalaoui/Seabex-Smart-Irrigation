<html><body>
<h2>Seabex - Smart Irrigation</h2>
<input id="s" type="number" placeholder="Humidite du sol (%)">
<input id="t" type="number" placeholder="Temperature (C)">
<input id="w" type="number" placeholder="Disponibilite eau (%)">
<button onclick="let a=Math.max(0,(60-s.value)/60*100),b=Math.max(0,(t.value-25)/15*100),c=100-w.value,r=Math.round((a+b+c)/3);res.innerHTML='Risk: '+r+'% - '+(r<35?'Faible':r<65?'Moyen':'Eleve')">Analyser le risque</button>
<h3 id="res">Resultat du risque</h3>
</body></html>
