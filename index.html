<html>
<body style="font-family:Arial;background:#eef4f1;padding:15px">
<div style="max-width:300px;margin:auto;background:white;padding:15px;border-radius:15px">
<h3>🌱 Seabex Risk Detection</h3>
<p>Agricultural Risk Monitoring</p>
Moisture:
<input id="m" type="number" value="15">
Temperature:
<input id="t" type="number" value="38">
Rainfall:
<input id="r" type="number" value="0">
<button onclick="go()">Analyze Risk</button>
<div id="o"></div>
</div>
<script>
function go(){
let m=+document.getElementById('m').value;
let t=+document.getElementById('t').value;
let r=+document.getElementById('r').value;
let o=document.getElementById('o');
if([m,t,r].some((v,i)=>document.getElementById(['m','t','r'][i]).value===''||v<[0,-10,0][i]||v>[100,60,Infinity][i])){
o.innerHTML="Enter valid values";return;
}
let s=Math.min(100,Math.round(Math.max(0,(25-m)*3)+Math.max(0,t-25)*2+Math.max(0,20-r)*1.5));
let risk=s>=60?"HIGH RISK":s>=30?"MEDIUM RISK":"LOW RISK";
o.innerHTML=`<h2>${risk}</h2><h1>${s}% Risk</h1>`;
o.style.background=s>=60?"#ffe0e0":s>=30?"#fff0d5":"#d9f5e5";
}
</script>
</body>
</html>
